name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Swift tests and macOS app (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify scripts and metadata
        run: |
          for script in build.sh scripts/*.sh; do bash -n "$script"; done
          plutil -lint Info.plist
          swift --version
      - name: Test, build, and package
        run: ./scripts/verify.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyBar-${{ matrix.runner }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
