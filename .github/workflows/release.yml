name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package universal macOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Resolve version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]]
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)"
          [[ "$version" == "${RELEASE_TAG#v}" ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Run tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          swift test
      - name: Build universal app
        run: |
          ./build.sh --universal
          lipo dist/CLIProxyBar.app/Contents/MacOS/CLIProxyBar -verify_arch arm64 x86_64
      - name: Package app and checksum
        run: ./scripts/package-release.sh
      - name: Sign update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          ./scripts/generate-appcast.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ./*.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/appcast.xml --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/appcast.xml \
              --verify-tag --title "CLIProxyBar ${RELEASE_TAG#v}" --notes-file docs/RELEASE_NOTES.md
          fi
      - name: Update same-repository Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/update-homebrew.py "$RELEASE_TAG" "dist/CLIProxyBar-${RELEASE_TAG#v}-macOS-universal.zip.sha256" --publish
